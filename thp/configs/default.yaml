asof:
  # Days after as_of within which late-ingested rows still count.
  # null disables the ingested_at filter (backfilled sources such as M5).
  ingest_grace_days: null

demand:
  # 14, not the spec's 13: a 90-day tenor from a mid-week as_of reaches week 14.
  horizon_weeks: 14
  # Trailing weeks of baseline forecast errors that set the quantile spread.
  residual_weeks: 52
  # External forecasts issued longer ago than this before as_of are ignored.
  external_max_age_days: 35

simulate:
  n_paths: 2000
  # Lognormal spread of the lead time around the expected receipt (median).
  receipt_sigma: 0.3
  markdown:
    # A SKU with lot stock is marked down when the lot is older than age_weeks or
    # its stock covers more than cover_weeks of median demand.
    age_weeks: 12
    cover_weeks: 26.0
    step: 0.20  # price cut per markdown, of list price
    max_total: 0.50  # deepest total cut
    interval_weeks: 4  # at most one step per interval
    elasticity: -1.5  # demand x (price ratio) ** elasticity
  # Gaussian copula (theory/copula.md): shares of each SKU-week's latent variance
  # from the merchant shock, the category shock and the SKU's persistent level.
  # The rest is noise per SKU-week, so they must sum to less than 1.
  # rho_sku and sku_persistence are assumptions until estimated from PIT values.
  rho_merchant: 0.15
  rho_category: 0.10
  rho_sku: 0.20
  # AR(1) week-to-week persistence of the shared shocks and of the SKU level.
  shock_persistence: 0.7
  sku_persistence: 0.9

underwrite:
  # Cash at the tenor must cover the loan plus fee in this share of paths.
  confidence: 0.95
  max_advance_rate: 0.80  # of lot cost

m5:
  tenant_id: m5
  # M5 has no costs: unit_cost = sell_price * (1 - gross margin). Assumed values.
  gross_margin_by_category:
    FOODS: 0.25
    HOUSEHOLD: 0.35
    HOBBIES: 0.40
  default_gross_margin: 0.30
