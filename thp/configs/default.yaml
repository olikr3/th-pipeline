asof:
  # Days after as_of within which late-ingested rows still count.
  # null disables the ingested_at filter (backfilled sources such as M5).
  ingest_grace_days: null

demand:
  horizon_weeks: 13
  # Trailing weeks of baseline forecast errors that set the quantile spread.
  residual_weeks: 52
  # External forecasts issued longer ago than this before as_of are ignored.
  external_max_age_days: 35

simulate:
  n_paths: 2000

m5:
  tenant_id: m5
  # M5 has no costs: unit_cost = sell_price * (1 - gross margin). Assumed values.
  gross_margin_by_category:
    FOODS: 0.25
    HOUSEHOLD: 0.35
    HOBBIES: 0.40
  default_gross_margin: 0.30
